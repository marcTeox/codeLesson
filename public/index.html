<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AI Prompt Demo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Mini AI Assistant</h1>

      <form id="prompt-form">
        <input
          id="prompt-input"
          type="text"
          placeholder="Ask something..."
          required
        />
        <button type="submit">Send</button>
      </form>

      <div id="output">Your response appears here...</div>
    </div>

    <script type="module" src="index.js"></script>
  </body>
</html>
