<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stock Report</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <!-- Action panel: add tickers and trigger report -->
      <section class="action-panel">
        <form id="ticker-input-form" autocomplete="off">
          <label for="ticker-input">Ticker symbol</label>
          <input
            id="ticker-input"
            name="ticker"
            type="text"
            placeholder="e.g. TSLA"
            required
            minlength="3"
          />
          <button type="submit" class="add-ticker-btn">Add</button>
        </form>

        <div class="ticker-choice-display" aria-live="polite"></div>

        <button class="generate-report-btn" disabled>Generate report</button>
      </section>

      <!-- Loading / status panel -->
      <section
        class="loading-panel"
        style="
          display: none;
          align-items: center;
          justify-content: center;
          flex-direction: column;
        "
      >
        <div id="api-message">Waiting...</div>
        <!-- optional spinner element -->
        <div class="loading-spinner" aria-hidden="true"></div>
      </section>

      <!-- Output panel for rendered report -->
      <section
        class="output-panel"
        style="display: none; flex-direction: column; gap: 1rem"
      ></section>
    </main>

    <!-- <script type="module" src="index.js"></script> -->
    <script type="module" src="open_ai/open_ai.js"></script>
  </body>
</html>
